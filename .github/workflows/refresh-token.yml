name: 인스타그램 토큰 연장

on:
  schedule:
    # 매주 월요일 한국 시간 정오. 토큰은 60일 뒤 만료되므로 매주 연장해 둔다.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 토큰 연장 후 Secret 갱신
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node src/refresh-token.js
